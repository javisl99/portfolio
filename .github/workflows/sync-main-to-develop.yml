name: Sync main dependency updates to develop

on:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  sync:
    name: Open sync PR for develop
    runs-on: ubuntu-latest
    steps:
      - name: Check out main and full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main

      - name: Check whether develop needs these updates
        id: changes
        run: |
          git fetch origin develop
          if git diff --quiet origin/develop HEAD -- package.json pnpm-lock.yaml .github/workflows; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the sync pull request
        if: steps.changes.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          pull_request_number="$(gh pr list --repo "$GH_REPO" --base develop --head "${GITHUB_REPOSITORY_OWNER}:main" --state open --json number --jq '.[0].number // ""')"

          if [ -z "$pull_request_number" ]; then
            gh pr create \
              --repo "$GH_REPO" \
              --base develop \
              --head main \
              --title "chore: sync main updates into develop" \
              --body "Propagates dependency and workflow updates that landed directly on main back into develop. Review and merge after the required checks pass."
            pull_request_number="$(gh pr list --repo "$GH_REPO" --base develop --head "${GITHUB_REPOSITORY_OWNER}:main" --state open --json number --jq '.[0].number // ""')"
          fi

          if [ -n "$pull_request_number" ]; then
            echo "Opened or refreshed sync PR #$pull_request_number."
          else
            echo "Could not find the sync PR after creating it." >&2
            exit 1
          fi
