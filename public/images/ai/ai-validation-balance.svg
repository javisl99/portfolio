<svg width="760" height="300" viewBox="0 0 760 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Balance entre IA y validación humana</title>
  <desc id="desc">Diagrama que separa las tareas donde la IA aporta velocidad de las responsabilidades que siguen siendo humanas.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="760" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220"/>
      <stop offset="1" stop-color="#0D1B32"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#34D399"/>
      <stop offset="1" stop-color="#86EFAC"/>
    </linearGradient>
  </defs>
  <rect width="760" height="300" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="758" height="298" rx="23" stroke="#263B63"/>

  <text x="36" y="44" fill="#93B4FF" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="4">RESPONSABILIDAD TÉCNICA</text>
  <text x="36" y="76" fill="#EAF2FF" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800">Qué acelera la IA vs qué sigo validando yo</text>

  <g transform="translate(36 112)">
    <rect width="320" height="148" rx="20" fill="#111A2B" stroke="#2A3D61"/>
    <circle cx="34" cy="34" r="16" fill="url(#blue)"/>
    <path d="M34 24v20M26 34h16" stroke="#07111F" stroke-width="2.4" stroke-linecap="round"/>
    <text x="62" y="39" fill="#EAF2FF" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800">IA acelera</text>
    <text x="28" y="78" fill="#A8B7D8" font-family="Inter, Arial, sans-serif" font-size="14">• Lectura de contexto complejo</text>
    <text x="28" y="104" fill="#A8B7D8" font-family="Inter, Arial, sans-serif" font-size="14">• Contraste de hipótesis</text>
    <text x="28" y="130" fill="#A8B7D8" font-family="Inter, Arial, sans-serif" font-size="14">• Scripts y documentación inicial</text>
  </g>

  <g transform="translate(404 112)">
    <rect width="320" height="148" rx="20" fill="#111A2B" stroke="#2A3D61"/>
    <circle cx="34" cy="34" r="16" fill="url(#green)"/>
    <path d="M27 34l5 5 11-13" stroke="#07111F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="62" y="39" fill="#EAF2FF" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800">Yo valido</text>
    <text x="28" y="78" fill="#A8B7D8" font-family="Inter, Arial, sans-serif" font-size="14">• Decisión técnica final</text>
    <text x="28" y="104" fill="#A8B7D8" font-family="Inter, Arial, sans-serif" font-size="14">• Pruebas locales y funcionales</text>
    <text x="28" y="130" fill="#A8B7D8" font-family="Inter, Arial, sans-serif" font-size="14">• Responsabilidad sobre el código</text>
  </g>
</svg>
